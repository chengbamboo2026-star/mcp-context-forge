server {
    listen 80;
    listen [::]:80;
    server_name auth.bamboo9527.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.bamboo9527.top;

    ssl_certificate /etc/letsencrypt/live/auth.bamboo9527.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.bamboo9527.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PowerWikiAuthTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;

    location ^~ /realms/power-wiki/clients-registrations/openid-connect {
        include /opt/hxds-mcp/contextforge-power-wiki/runtime/openai-registration-allowlist.conf;
        deny all;
        proxy_pass http://127.0.0.1:8053;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /.well-known/ {
        proxy_pass http://127.0.0.1:8053;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /.well-known/oauth-authorization-server/realms/power-wiki {
        proxy_pass http://127.0.0.1:8053;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        sub_filter_types application/json;
        sub_filter_once on;
        sub_filter '"token_endpoint_auth_methods_supported":["private_key_jwt"' '"token_endpoint_auth_methods_supported":["none","private_key_jwt"';
    }

    location ^~ /realms/power-wiki/protocol/openid-connect/ {
        proxy_pass http://127.0.0.1:8053;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /realms/power-wiki/login-actions/ {
        proxy_pass http://127.0.0.1:8053;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /realms/power-wiki/.well-known/ {
        proxy_pass http://127.0.0.1:8053;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        sub_filter_types application/json;
        sub_filter_once on;
        sub_filter '"token_endpoint_auth_methods_supported":["private_key_jwt"' '"token_endpoint_auth_methods_supported":["none","private_key_jwt"';
    }

    location ^~ /resources/ {
        proxy_pass http://127.0.0.1:8053;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
