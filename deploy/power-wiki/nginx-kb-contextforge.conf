server {
    listen 80;
    listen [::]:80;
    server_name kb.bamboo9527.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kb.bamboo9527.top;

    ssl_certificate /etc/letsencrypt/live/kb.bamboo9527.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kb.bamboo9527.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ContextForgeTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 16m;

    # Keep the public MCP/data-plane and discovery routes on ContextForge.
    # The independent Web UI BFF owns browser authentication and /api/*.
    location ~ ^/(?:servers/|\.well-known/|mcp(?:/|$)|rpc$|sse(?:/|$)|message(?:/|$)|health$|openapi\.json$|docs(?:/|$)|redoc(?:/|$)|metrics(?:/|$)|version$) {
        proxy_pass http://127.0.0.1:8051;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Preserve old bookmarks while moving operators to the new experience.
    location ^~ /admin {
        return 302 /app/;
    }

    location / {
        proxy_pass http://127.0.0.1:8052;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
